<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD Alunos</title>
</head>

<body>

    <h1>Cadastro de Alunos</h1>

    <form id="formAluno">

        <input type="hidden" id="id">

        <p>
            Nome:
            <input type="text" id="nome">
        </p>

        <p>
            Email:
            <input type="email" id="email">
        </p>

        <button type="submit">
            Salvar
        </button>

    </form>

    <hr>

    <h2>Alunos</h2>

    <div id="lista"></div>

    <script src="js/script.js"></script>

</body>
</html>
